name: Release (Windows Onefile)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 获取完整历史+所有标签，供"生成changelog"步骤取得上一个tag与提交日志
          # （默认浅克隆只拉当前tag一个提交，导致 git describe/log 拿不到数据）
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python 3.8 (strict)
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Show Python version
        run: |
          python --version
          pip --version

      - name: Upgrade pip tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # 使用 temp.txt 安装依赖（无版本限制，与本地环境一致）
      # 然后手动指定 Flask/Werkzeug 版本以确保 Python 3.8 兼容
      - name: Install dependencies (Python 3.8 compatible)
        shell: pwsh
        run: |
          pip install -r temp.txt
          pip install "Flask==2.3.3" "Werkzeug==2.3.8"
          pip install "cryptography==3.4.8"
          python -c "import netifaces; print('netifaces ok:', netifaces.__version__)"
          python -c "import pystray; print('pystray ok:', pystray.__version__)"
          python -c "import pyotp; print('pyotp ok:', pyotp.__name__)"
          python -c "import cryptography; print('cryptography ok:', cryptography.__version__)"
          python -c "import wsgidav, defusedxml; print('wsgidav/defusedxml ok')"
          python -c "import ip2region.searcher, ip2region.util; print('ip2region ok')"
          # 固定 PyInstaller 4.10（与 requirements.txt 一致）：
          # 后台服务使用 NSSM 托管 --headless-server，任何版本均可；
          # 保留 4.10 作为无 NSSM 时 pywin32 直接服务回退路径的兼容基线。
          pip install "pyinstaller==4.10" "pyinstaller-hooks-contrib==2022.15"

      - name: Run tests
        shell: pwsh
        run: |
          pip install pytest
          python -m pytest tests -q

      - name: Build onefile exe
        run: |
          pyinstaller --clean main-onefile.spec

      - name: Build zip package
        run: |
          pyinstaller --clean main-zip.spec

      - name: Verify artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/file_share.exe")) {
            Write-Error "dist/file_share.exe not found"
            exit 1
          }
          if (-not (Test-Path "dist/main/file_share.exe")) {
            Write-Error "dist/main/file_share.exe not found"
            exit 1
          }
          Get-Item "dist/file_share.exe" | Format-List FullName,Length,LastWriteTime
          Get-Item "dist/main/file_share.exe" | Format-List FullName,Length,LastWriteTime

      - name: Generate changelog from git
        shell: pwsh
        run: |
          # 获取当前 tag 名称
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          # 找到上一个版本 tag（排除当前 tag）
          $prevTag = git describe --tags --abbrev=0 "$tag^" 2>$null
          if (-not $prevTag) {
            $prevTag = (git tag --sort=-v:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1)
          }
          if (-not $prevTag) {
            $prevTag = ''
          }

          $body = @"
          ## 文件分享工具 - Windows 版本

          ### 📦 下载选项：

          **1. 单文件版本** (``file_share.exe``)
          - 适用于 Windows 7 及以上系统
          - 一键运行，无需解压
          - 适合快速部署和使用

          **2. 压缩包版本** (``file_share.zip``)
          - 解压后运行 ``file_share.exe``
          - 优点：方便修改模板文件（templates/）和静态资源（static/）
          - 适合需要自定义界面或功能的用户

          ### 💡 使用说明：
          - 单文件版本：直接双击运行即可
          - 压缩包版本：解压后双击 ``file_share.exe`` 运行
          - 首次运行会自动配置防火墙规则
          - 支持系统托盘后台运行

          ### 🔧 系统要求：
          - Windows 7 SP1 及以上版本
          - .NET Framework 4.5+（通常系统已内置）

          FULLCHANGELOG
          "@

          # 生成变更日志（从上一版本到当前版本的提交）
          if ($prevTag) {
            $range = "$prevTag..$tag"
            $logLines = git log --pretty=format:'%h %s' $range
            $changelog = @()
            foreach ($line in $logLines) {
              $changelog += "- $line"
            }
            if ($changelog.Count -gt 0) {
              $changelogBlock = "`n### 📝 本次更新内容：`n" + ($changelog -join "`n")
              $body = $body -replace 'FULLCHANGELOG', $changelogBlock
            } else {
              $body = $body -replace 'FULLCHANGELOG', ''
            }
          } else {
            $body = $body -replace 'FULLCHANGELOG', ''
          }

          # 写入 release body 文件
          $body | Set-Content -Path release_body.md -Encoding UTF8

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist/file_share.exe" "release/file_share.exe"
          Compress-Archive -Path "dist/main/*" -DestinationPath "release/file_share.zip" -Force

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: |
            release/file_share.exe
            release/file_share.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
